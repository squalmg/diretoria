<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diretoria HML — CRM</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f5f5f5;background:#09090b;color-scheme:dark;--muted:#a1a1aa;--line:#2b2b31;--panel:#111114;--soft:#0d0d10;--ok:#86efac;--warn:#fde68a;--danger:#fca5a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b1b23 0,transparent 32%),#09090b;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1540px;margin:auto;padding:15px}.top,.panel{border:1px solid var(--line);background:#111114e8;border-radius:16px}.top{padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:8px;z-index:20;backdrop-filter:blur(14px)}.badge{font-size:11px;letter-spacing:.08em;border:1px solid #52525b;border-radius:999px;padding:5px 8px;color:var(--warn)}a{color:inherit}.muted,.small{color:var(--muted)}.small{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.metric{border:1px solid var(--line);background:#0d0d10;border-radius:14px;padding:14px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:24px;margin-top:4px}.layout{display:grid;grid-template-columns:390px minmax(0,1fr);gap:14px}.head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.body{padding:13px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.filters .wide{grid-column:1/-1}input,select{width:100%;border:1px solid #3f3f46;background:#0d0d10;color:#fff;border-radius:9px;padding:9px;outline:none}.btn{border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.btn:hover{background:#3f3f46}.items{display:grid;gap:7px;max-height:calc(100vh - 330px);overflow:auto}.person{width:100%;text-align:left;border:1px solid var(--line);background:#0d0d10;color:#fff;border-radius:12px;padding:11px;cursor:pointer}.person:hover,.person.active{border-color:#52525b;background:#18181b}.person strong{display:block;margin-bottom:4px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{font-size:10px;border:1px solid #3f3f46;border-radius:999px;padding:3px 6px;color:#c4c4cc}.chip.ok{color:var(--ok);border-color:#24553a}.chip.off{color:#8b8b94}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid var(--line);background:#0d0d10;border-radius:13px;overflow:hidden}.section h3{font-size:14px;margin:0;padding:11px 12px;border-bottom:1px solid var(--line)}.rows{padding:8px 12px}.row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #202024;font-size:12px}.row:last-child{border-bottom:0}.timeline{display:grid;gap:7px;padding:9px 11px;max-height:300px;overflow:auto}.event{border-left:2px solid #3f3f46;padding:4px 0 4px 9px}.event b{font-size:12px}.event div{font-size:11px;color:var(--muted);margin-top:3px}.full{grid-column:1/-1}.message{padding:24px;text-align:center;color:var(--muted)}.stage-bars{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.stage-bar{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:11px;background:#0d0d10}.hidden{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.items{max-height:420px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.shell{padding:8px}.metrics,.detail-grid,.filters{grid-template-columns:1fr}.filters .wide,.full{grid-column:auto}.top{position:static;align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell">
<header class="top"><div><strong>Diretoria</strong> <span class="badge">HML · CRM READ-ONLY</span></div><div class="small"><a href="/">portal</a> · <a href="/writes.html">econômico</a> · <span id="session">validando sessão…</span></div></header>
<section id="blocked" class="panel" style="margin-top:14px"><div class="message">Validando sessão HML…</div></section>
<main id="app" class="hidden"><div id="metrics" class="metrics"></div><div id="stages" class="stage-bars"></div>
<div class="layout">
<aside class="panel"><div class="head"><div><strong>CRM</strong><div class="small">perfis consolidados</div></div><button id="refresh" class="btn">Atualizar</button></div><div class="body"><div class="filters"><input id="search" class="wide" placeholder="Nome, e-mail ou telefone"><select id="stage"><option value="">Todos os estágios</option></select><select id="source"><option value="">Todas as origens</option></select><select id="campaign" class="wide"><option value="">Todas as campanhas</option></select></div><div id="items" class="items"><div class="message">Carregando…</div></div></div></aside>
<section class="panel"><div class="head"><div><strong id="title">Perfil 360</strong><div id="subtitle" class="small">Selecione uma pessoa.</div></div></div><div id="detail" class="body"><div class="message">Nenhum perfil selecionado.</div></div></section>
</div></main></div><script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script><script src="/crm.js"></script></body></html>
