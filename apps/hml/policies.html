<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diretoria HML — Políticas</title><style>:root{font-family:Inter,system-ui;background:#09090b;color:#f5f5f5;color-scheme:dark;--l:#303036;--m:#a1a1aa;--ok:#86efac;--e:#fca5a5}*{box-sizing:border-box}body{margin:0}.s{max-width:1050px;margin:auto;padding:16px}.p{border:1px solid var(--l);background:#111114;border-radius:16px;padding:16px;margin-bottom:14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px;margin:10px 0;color:var(--m);font-size:12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0e0e11;border:1px solid var(--l);color:#fff;border-radius:9px;padding:9px}textarea{min-height:280px}.b{padding:10px;border-radius:9px;border:1px solid #444;background:#f5f4ef;color:#111;font-weight:800;cursor:pointer}.b:disabled{opacity:.4}.msg{border:1px solid var(--l);padding:10px;border-radius:9px;color:var(--m);white-space:pre-wrap}.ok{color:var(--ok)}.err{color:var(--e)}.doc{border:1px solid var(--l);border-radius:9px;padding:10px;margin-top:8px}.doc pre{white-space:pre-wrap;max-height:220px;overflow:auto;color:#ccc}.hide{display:none}a{color:inherit}footer{text-align:center;color:#777}@media(max-width:760px){.g{grid-template-columns:1fr}}</style></head><body><div class="s"><div class="p"><strong>Diretoria HML · Políticas do checkout</strong><p>O sistema não gera texto jurídico. Ele versiona e ativa somente conteúdo fornecido e revisado.</p><div id="session" class="msg">Validando sessão…</div></div><div class="g"><section class="p"><h2>Novo rascunho</h2><form id="form"><label>Documento<select name="code"><option value="club_terms">club_terms</option><option value="non_achievement_policy">non_achievement_policy</option><option value="privacy_policy">privacy_policy</option></select></label><label>Título<input name="title" required maxlength="180"></label><label>Conteúdo aprovado<textarea name="content" required placeholder="Cole aqui o conteúdo aprovado; não existe texto automático."></textarea></label><label style="display:flex;grid-template-columns:auto 1fr"><input id="ack" type="checkbox" style="width:auto"><span>Confirmo que este conteúdo foi revisado para HML.</span></label><button id="draft" class="b" disabled>Criar rascunho versionado</button></form><div id="draftState" class="msg">Nenhum rascunho criado.</div><button id="activate" class="b hide">Ativar rascunho</button></section><section class="p"><h2>Bundle ativo</h2><button id="refresh" class="b">Atualizar</button><div id="bundleState" class="msg">Consultando…</div><div id="docs"></div></section></div><footer>Desenvolvido por <a href="https://clanmarketing.com.br/">Clan Digital</a></footer></div><script src="/policies.js"></script></body></html>
