name: ci

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Domain and static checks
        run: npm run check
      - name: Apply migrations from zero
        env:
          PGPASSWORD: ci_only_password
        run: |
          for migration in packages/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Assert foundation schema and hardening
        env:
          PGPASSWORD: ci_only_password
        run: |
          core_count=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('profiles','events','payments','credits','quorum_snapshots','audit_logs');")
          test "$core_count" = "6"

          rls_count=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity=true and c.relname in ('profiles','users','roles','permissions','events','user_roles','role_permissions','event_status_history','event_financial_configs','payments','payment_webhook_receipts','payment_events','credits','credit_movements','event_cost_items','event_revenue_commitments','quorum_snapshots','event_confirmation_checks','event_go_no_go_reviews','ledger_accounts','financial_transactions','financial_postings','audit_logs');")
          test "$rls_count" = "23"

          user_roles_pk=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_constraint where conrelid='public.user_roles'::regclass and contype='p';")
          test "$user_roles_pk" = "1"
