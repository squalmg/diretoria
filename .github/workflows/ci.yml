name: ci

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Domain and static checks
        run: npm run check
      - name: Apply migrations from zero
        env:
          PGPASSWORD: ci_only_password
        run: |
          for migration in packages/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Assert foundation schema and hardening
        env:
          PGPASSWORD: ci_only_password
        run: |
          core_count=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('profiles','events','payments','credits','refunds','quorum_snapshots','audit_logs','hml_admin_allowlist','hml_bootstrap_tokens');")
          test "$core_count" = "9"

          rls_count=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity=true and c.relname in ('profiles','users','roles','permissions','events','user_roles','role_permissions','event_status_history','event_financial_configs','payments','payment_webhook_receipts','payment_events','credits','credit_movements','refunds','event_cost_items','event_revenue_commitments','quorum_snapshots','event_confirmation_checks','event_go_no_go_reviews','ledger_accounts','financial_transactions','financial_postings','audit_logs','hml_admin_allowlist','hml_bootstrap_tokens');")
          test "$rls_count" = "26"

          user_roles_pk=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_constraint where conrelid='public.user_roles'::regclass and contype='p';")
          test "$user_roles_pk" = "1"

          state_guard=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_trigger where tgrelid='public.events'::regclass and tgname='events_state_guard' and not tgisinternal;")
          test "$state_guard" = "1"

          bootstrap_security=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='hml_consume_bootstrap' and p.prosecdef=true and coalesce(array_to_string(p.proconfig,','),'') like '%search_path=public, pg_temp%';")
          test "$bootstrap_security" = "1"
      - name: Bootstrap token integration
        env:
          PGPASSWORD: ci_only_password
        run: |
          psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 <<'SQL'
          insert into hml_bootstrap_tokens(token_hash, expires_at, note)
          values ('ci-bootstrap-hash', now() + interval '1 hour', 'CI probe');
          SQL

          first=$(psql -h localhost -U diretoria -d diretoria -Atc "select hml_consume_bootstrap('ci-bootstrap-hash','HML-CI@EXAMPLE.INVALID');")
          test "$first" = "t"

          second=$(psql -h localhost -U diretoria -d diretoria -Atc "select hml_consume_bootstrap('ci-bootstrap-hash','other@example.invalid');")
          test "$second" = "f"

          allowlisted=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from hml_admin_allowlist where email_normalized='hml-ci@example.invalid' and enabled=true;")
          test "$allowlisted" = "1"
      - name: Economic core integration
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: npm run integration:economic-core
      - name: Backup and restore drill
        run: |
          POSTGRES_CONTAINER=$(docker ps --filter "ancestor=postgres:18.6-alpine" --format '{{.ID}}' | head -n1)
          test -n "$POSTGRES_CONTAINER"

          docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            psql -U diretoria -d diretoria -v ON_ERROR_STOP=1 \
            -c "insert into profiles(display_code, full_name, email_normalized) values ('RESTORE-PROBE','Restore Probe','restore-probe@example.invalid');"

          docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            pg_dump -U diretoria -d diretoria -Fc -f /tmp/diretoria.backup

          docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            createdb -U diretoria diretoria_restore

          docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            pg_restore -U diretoria -d diretoria_restore --no-owner --no-privileges /tmp/diretoria.backup

          probe_count=$(docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            psql -U diretoria -d diretoria_restore -Atc "select count(*) from profiles where display_code='RESTORE-PROBE';")
          test "$probe_count" = "1"

          role_count=$(docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            psql -U diretoria -d diretoria_restore -Atc "select count(*) from roles;")
          test "$role_count" = "8"

          restored_rls_count=$(docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            psql -U diretoria -d diretoria_restore -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity=true and c.relname in ('profiles','users','roles','permissions','events','user_roles','role_permissions','event_status_history','event_financial_configs','payments','payment_webhook_receipts','payment_events','credits','credit_movements','refunds','event_cost_items','event_revenue_commitments','quorum_snapshots','event_confirmation_checks','event_go_no_go_reviews','ledger_accounts','financial_transactions','financial_postings','audit_logs','hml_admin_allowlist','hml_bootstrap_tokens');")
          test "$restored_rls_count" = "26"

          restored_allowlist=$(docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            psql -U diretoria -d diretoria_restore -Atc "select count(*) from hml_admin_allowlist where email_normalized='hml-ci@example.invalid' and enabled=true;")
          test "$restored_allowlist" = "1"

          docker exec -e PGPASSWORD=ci_only_password "$POSTGRES_CONTAINER" \
            dropdb -U diretoria diretoria_restore
