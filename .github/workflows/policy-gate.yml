name: policy-gate

on:
  pull_request:
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/src/policy-gate.ts'
      - 'scripts/integration-policy-gate.ts'
      - '.github/workflows/policy-gate.yml'
  workflow_dispatch:

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Static policy checks
        run: |
          node --check packages/db/src/policy-gate.ts
          grep -q "POLICY_DOCUMENT_IMMUTABLE_AFTER_ACTIVATION" packages/db/migrations/0022_policy_acceptance_gate.sql
          grep -q "POLICY_ACCEPTANCE_APPEND_ONLY" packages/db/migrations/0022_policy_acceptance_gate.sql
          grep -q "POLICY_ACCEPTANCE_REQUIRED" packages/db/src/policy-gate.ts
      - name: Apply migrations from zero
        env:
          PGPASSWORD: ci_only_password
        run: |
          for f in packages/db/migrations/*.sql; do
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Policy gate integration
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: node --experimental-strip-types scripts/integration-policy-gate.ts
      - name: Assert one-active and append-only guards
        env:
          PGPASSWORD: ci_only_password
        run: |
          active_idx=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_indexes where schemaname='public' and indexname='policy_documents_one_active_uq';")
          update_guard=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_trigger where tgname='policy_acceptances_update_guard' and not tgisinternal;")
          delete_guard=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from pg_trigger where tgname='policy_acceptances_delete_guard' and not tgisinternal;")
          test "$active_idx" = "1"
          test "$update_guard" = "1"
          test "$delete_guard" = "1"
