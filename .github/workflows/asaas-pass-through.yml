name: asaas-pass-through

on:
  pull_request:
    paths:
      - 'packages/db/migrations/**'
      - 'packages/payments/asaas-fees.ts'
      - 'packages/payments/asaas-fees.test.ts'
      - 'scripts/integration-asaas-pass-through.ts'
      - '.github/workflows/asaas-pass-through.yml'
  workflow_dispatch:

jobs:
  asaas-pass-through:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Unit fee quotation checks
        run: node --experimental-strip-types --test packages/payments/asaas-fees.test.ts
      - name: Static policy checks
        run: |
          grep -q "fee_pass_through" packages/db/migrations/0023_asaas_fee_pass_through.sql
          grep -q "processing_fee_amount" packages/db/migrations/0023_asaas_fee_pass_through.sql
          grep -q "provider: 'asaas'" packages/payments/asaas-fees.ts
      - name: Apply migrations from zero
        env:
          PGPASSWORD: ci_only_password
        run: |
          for f in packages/db/migrations/*.sql; do
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Postgres pass-through integration
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: node --experimental-strip-types scripts/integration-asaas-pass-through.ts
