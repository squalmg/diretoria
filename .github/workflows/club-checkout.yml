name: club-checkout

on:
  pull_request:
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/src/club-checkout.ts'
      - 'scripts/integration-club-checkout.ts'
      - 'scripts/check-club-local.mjs'
      - 'scripts/check-member-api-v3-local.mjs'
      - 'scripts/check-checkout-api-local.mjs'
      - 'scripts/check-checkout-policy-api-local.mjs'
      - 'supabase/functions/diretoria-member-api/**'
      - 'supabase/functions/diretoria-asaas-checkout-api/**'
      - 'supabase/functions/diretoria-checkout-policy-api/**'
      - 'supabase/functions/diretoria-checkout-status/**'
      - 'apps/public-hml/club.*'
      - '.github/workflows/club-checkout.yml'
  workflow_dispatch:

jobs:
  club-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: V3 static contract checks
        run: |
          node --experimental-strip-types --check packages/db/src/club-checkout.ts
          node --check apps/public-hml/club.js
          node scripts/check-club-local.mjs
          node scripts/check-member-api-v3-local.mjs
          node scripts/check-checkout-api-local.mjs
          node scripts/check-checkout-policy-api-local.mjs
          grep -q "provider: 'unconfigured'" packages/db/src/club-checkout.ts
          if grep -Eqi "stripe|mercadopago|pagarme|paymentintent|client_secret|card.?number|security.?code|cvv" apps/public-hml/club.js supabase/functions/diretoria-member-api/index.ts supabase/functions/diretoria-asaas-checkout-api/index.ts; then
            echo "Forbidden payment capability or card-data handling found in Club flow."
            exit 1
          fi
          if grep -Eq "ASAAS_ACCESS_TOKEN=['\"]|ASAAS_WEBHOOK_AUTH_TOKEN=['\"]" apps/public-hml/club.js supabase/functions/diretoria-member-api/index.ts supabase/functions/diretoria-asaas-checkout-api/index.ts; then
            echo "Asaas secret literal found in source."
            exit 1
          fi
      - name: Apply migrations from zero
        env:
          PGPASSWORD: ci_only_password
        run: |
          for f in packages/db/migrations/*.sql; do
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Club checkout integration
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: node --experimental-strip-types scripts/integration-club-checkout.ts
      - name: Assert checkout intent remains separate from payment
        env:
          PGPASSWORD: ci_only_password
        run: |
          count=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='checkout_intents' and column_name='payment_id';")
          test "$count" = "0"
