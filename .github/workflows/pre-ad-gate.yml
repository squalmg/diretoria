name: pre-ad-gate

on:
  push:
  pull_request:

jobs:
  pre-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: diretoria
          POSTGRES_USER: diretoria
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diretoria -d diretoria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply all migrations
        env:
          PGPASSWORD: ci_only_password
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql -h localhost -U diretoria -d diretoria -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Assert asset catalog schema
        env:
          PGPASSWORD: ci_only_password
        run: |
          columns=$(psql -h localhost -U diretoria -d diretoria -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='assets' and column_name in ('historical_event_label','captured_at','source_credit','rights_notes','external_source_url','created_by','updated_by','updated_at');")
          test "$columns" = "8"
      - name: Asset catalog integration
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: npm run integration:asset-catalog
      - name: First-party acquisition insights
        env:
          DATABASE_URL: postgresql://diretoria:ci_only_password@localhost:5432/diretoria
        run: npm run integration:acquisition-insights
