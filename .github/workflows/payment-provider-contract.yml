name: payment-provider-contract

on:
  pull_request:
    paths:
      - 'packages/payments/**'
      - 'scripts/integration-payment-provider-contract.ts'
      - '.github/workflows/payment-provider-contract.yml'
  workflow_dispatch:

jobs:
  payment-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Static provider guard
        run: |
          node --check packages/payments/provider-contract.ts
          if grep -Eqi "mercadopago|stripe|asaas|pagarme|pagseguro|efi|gerencianet|cielo|rede" packages/payments/provider-contract.ts; then
            echo "Concrete payment provider found before provider decision."
            exit 1
          fi
          grep -q "name = 'unconfigured'" packages/payments/provider-contract.ts
          grep -q "PAYMENT_PROVIDER_WEBHOOK_VERIFICATION_REQUIRED" packages/payments/provider-contract.ts
      - name: Provider contract integration
        run: node --experimental-strip-types scripts/integration-payment-provider-contract.ts
