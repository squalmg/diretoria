services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diretoria}
      POSTGRES_USER: ${POSTGRES_USER:-diretoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_ONLY}
    ports:
      - "54329:5432"
    volumes:
      - diretoria_pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diretoria} -d ${POSTGRES_DB:-diretoria}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  diretoria_pgdata:
